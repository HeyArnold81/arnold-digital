<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Page Not Found | [Business Name]</title>

  <meta
    name="description"
    content="The page you're looking for could not be found."
  >

  <meta name="robots" content="noindex, follow">

  <meta name="theme-color" content="#0F172A">

  <link
    rel="stylesheet"
    href="css/styles.css"
  >
</head>

<body>

  <a
    class="skip-link"
    href="#main-content"
  >
    Skip to main content
  </a>


  <header class="site-header">
    <div class="container header-inner">

      <a
        class="brand"
        href="/"
        aria-label="[Business Name] home"
      >
        <span
          class="brand-mark"
          aria-hidden="true"
        >
          P
        </span>

        <span class="brand-text">
          [Business Name]
        </span>
      </a>

    </div>
  </header>


  <main id="main-content" tabindex="-1">

    <section class="error-page">

      <div class="container error-page-inner">

        <p class="eyebrow">
          404
        </p>

        <h1>
          This page doesn't exist.
        </h1>

        <p>
          The link may be out of date, or the page may have moved.
          The good news is the rest of the website is still exactly
          where it should be.
        </p>

        <a
          class="button button-primary"
          href="/"
        >
          Back to the homepage
        </a>

      </div>

    </section>

  </main>


  <footer class="site-footer error-footer">

    <div class="container footer-bottom">

      <p>
        &copy; 2026 [Business Name].
        All rights reserved.
      </p>

    </div>

  </footer>

</body>
</html>
